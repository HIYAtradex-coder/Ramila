services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiya
      POSTGRES_PASSWORD: hiya_dev
      POSTGRES_DB: hiya_smartpos
    ports:
      - "5432:5432"
    volumes:
      - hiya_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiya -d hiya_smartpos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hiya_pg:
